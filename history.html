<!-- 날짜별 푸쉬업 기록을 월 단위로 조회하는 기록 페이지 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" />
  <title>푸쉬업 기록</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; font-family: -apple-system, "Noto Sans KR", sans-serif;
      background: #0d1117; color: #fff; }
    #wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }

    .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .topbar a { color: #7cc6f2; text-decoration: none; font-size: 14px; font-weight: 700;
      background: #1d2836; border: 1px solid #2b3a4d; border-radius: 10px; padding: 9px 14px; }
    .topbar h1 { font-size: 17px; margin: 0; flex: 1; text-align: center; color: #cbd3dd; }

    /* 월 이동 */
    .monthnav { display: flex; align-items: center; justify-content: space-between;
      background: #131922; border: 1px solid #222833; border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; }
    .monthnav button { background: #2a3342; color: #fff; border: none; border-radius: 10px;
      width: 42px; height: 38px; font-size: 18px; font-weight: 700; }
    .monthnav button:disabled { opacity: 0.35; }
    #monthLabel { font-size: 18px; font-weight: 800; }

    /* KPI */
    .kpis { display: flex; gap: 8px; margin-bottom: 14px; }
    .kpi { flex: 1; background: #131922; border: 1px solid #222833; border-radius: 14px; padding: 12px 8px; text-align: center; }
    .kpi .lbl { font-size: 11px; color: #8a919c; margin-bottom: 5px; }
    .kpi .val { font-size: 21px; font-weight: 800; }
    .kpi .val.blue { color: #7cc6f2; }

    /* 막대그래프 */
    .card { background: #131922; border: 1px solid #222833; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    .card h2 { font-size: 14px; margin: 0 0 12px; color: #aeb6c2; font-weight: 700; }
    #chart { display: flex; align-items: flex-end; gap: 2px; height: 150px; }
    .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
    .bar .fill { background: #2f6fed; border-radius: 3px 3px 0 0; min-height: 2px; }
    .bar .fill.today { background: #7cc6f2; }
    .bar .fill.empty { background: #1e2632; }
    #chartAxis { display: flex; gap: 2px; margin-top: 6px; }
    #chartAxis span { flex: 1; text-align: center; font-size: 8px; color: #5f6875; }

    /* 표 */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 8px; text-align: right; border-bottom: 1px solid #1e2632; }
    th { color: #8a919c; font-size: 12px; font-weight: 600; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    td.num { font-variant-numeric: tabular-nums; }
    tr.today td { color: #7cc6f2; font-weight: 700; }
    tfoot td { border-top: 2px solid #2b3a4d; border-bottom: none; font-weight: 800; }
    .empty-msg { color: #6b7480; font-size: 14px; text-align: center; padding: 24px 0; }

    .footnote { font-size: 12px; color: #6b7480; text-align: center; margin-top: 8px; }
    #clearAll { display: block; margin: 18px auto 0; background: none; border: none;
      color: #6b7480; font-size: 12px; text-decoration: underline; }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="topbar">
      <a href="index.html">&#8592; 운동</a>
      <h1>푸쉬업 기록</h1>
      <span style="width:62px"></span>
    </div>

    <div class="monthnav">
      <button id="prevBtn">&#8249;</button>
      <div id="monthLabel">-</div>
      <button id="nextBtn">&#8250;</button>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="lbl">이번 달 합계</div><div class="val blue" id="kpiTotal">0</div></div>
      <div class="kpi"><div class="lbl">운동한 날</div><div class="val" id="kpiDays">0</div></div>
      <div class="kpi"><div class="lbl">하루 평균</div><div class="val" id="kpiAvg">0</div></div>
    </div>

    <div class="card">
      <h2>일자별 개수</h2>
      <div id="chart"></div>
      <div id="chartAxis"></div>
    </div>

    <div class="card">
      <h2>일자별 상세</h2>
      <div id="tableArea"></div>
    </div>

    <div class="footnote">전체 누적 <span id="allTime">0</span>개</div>
    <button id="clearAll">전체 기록 삭제</button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const pad2 = (n) => (n < 10 ? '0' + n : '' + n);
    const fmt = (n) => n.toLocaleString();

    function readHistory() {
      try { return JSON.parse(localStorage.getItem('pushup_history') || '{}'); }
      catch (e) { return {}; }
    }

    const now = new Date();
    let viewY = now.getFullYear(), viewM = now.getMonth() + 1; // 1~12
    const todayKey = now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate());

    function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

    function render() {
      const hist = readHistory();
      const dim = daysInMonth(viewY, viewM);
      $('monthLabel').textContent = viewY + '년 ' + viewM + '월';

      // 이번 달 데이터 수집
      const daily = [];
      let total = 0, activeDays = 0, max = 0;
      for (let d = 1; d <= dim; d++) {
        const key = viewY + '-' + pad2(viewM) + '-' + pad2(d);
        const v = hist[key] || 0;
        daily.push({ day: d, key: key, val: v });
        total += v;
        if (v > 0) activeDays++;
        if (v > max) max = v;
      }

      $('kpiTotal').textContent = fmt(total);
      $('kpiDays').textContent = fmt(activeDays) + '일';
      $('kpiAvg').textContent = activeDays ? fmt(Math.round(total / activeDays)) : '0';

      // 막대그래프
      const chart = $('chart'), axis = $('chartAxis');
      chart.innerHTML = ''; axis.innerHTML = '';
      daily.forEach((it) => {
        const bar = document.createElement('div'); bar.className = 'bar';
        const fill = document.createElement('div');
        fill.className = 'fill' + (it.val === 0 ? ' empty' : (it.key === todayKey ? ' today' : ''));
        fill.style.height = (max > 0 ? Math.max(2, (it.val / max) * 100) : 2) + '%';
        fill.title = it.day + '일 · ' + fmt(it.val) + '개';
        bar.appendChild(fill); chart.appendChild(bar);
        const lb = document.createElement('span');
        lb.textContent = (it.day === 1 || it.day % 5 === 0) ? it.day : '';
        axis.appendChild(lb);
      });

      // 표 (기록 있는 날만, 최신순)
      const rows = daily.filter((it) => it.val > 0).sort((a, b) => b.day - a.day);
      const area = $('tableArea');
      if (rows.length === 0) {
        area.innerHTML = '<div class="empty-msg">이 달에는 기록이 없습니다</div>';
      } else {
        let html = '<table><thead><tr><th>일자</th><th>요일</th><th>개수</th><th>비중</th></tr></thead><tbody>';
        const wd = ['일', '월', '화', '수', '목', '금', '토'];
        rows.forEach((it) => {
          const dow = wd[new Date(viewY, viewM - 1, it.day).getDay()];
          const share = total ? ((it.val / total) * 100).toFixed(1) : '0.0';
          const cls = it.key === todayKey ? ' class="today"' : '';
          html += '<tr' + cls + '><td>' + viewM + '월 ' + it.day + '일</td><td>' + dow +
                  '</td><td class="num">' + fmt(it.val) + '</td><td class="num">' + share + '%</td></tr>';
        });
        html += '</tbody><tfoot><tr><td>합계</td><td></td><td class="num">' + fmt(total) +
                '</td><td class="num">100.0%</td></tr></tfoot></table>';
        area.innerHTML = html;
      }

      // 전체 누적
      let all = 0;
      Object.keys(hist).forEach((k) => { all += hist[k] || 0; });
      $('allTime').textContent = fmt(all);

      // 다음 달 버튼: 현재 달 이후로는 이동 금지
      $('nextBtn').disabled = (viewY > now.getFullYear()) ||
        (viewY === now.getFullYear() && viewM >= now.getMonth() + 1);
    }

    $('prevBtn').addEventListener('click', () => {
      viewM--; if (viewM < 1) { viewM = 12; viewY--; } render();
    });
    $('nextBtn').addEventListener('click', () => {
      viewM++; if (viewM > 12) { viewM = 1; viewY++; } render();
    });
    $('clearAll').addEventListener('click', () => {
      if (confirm('저장된 모든 기록을 삭제할까요? 되돌릴 수 없습니다.')) {
        localStorage.removeItem('pushup_history');
        render();
      }
    });

    render();
  </script>
</body>
</html>
